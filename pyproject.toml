[project]
name = "rakshak"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasketch>=2.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "idna>=3.20",
    "langgraph>=1.2.12",
    "numpy>=2.4.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "scipy>=1.17.1",
    "sentry-sdk>=2.71.0",
    "tldextract>=5.3.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
train = [
    "huggingface-hub>=1.33.0",
    "peft>=0.21.2",
    "tinker>=0.32.0",
    "tinker-cookbook>=0.1.0",
    "transformers>=5.18.0",
]
mlx = [
    "mlx-lm>=0.32.0",
    "mlx-whisper>=0.4.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["pwa", "models", "var", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length; long docstrings and verbatim PRD JSON are fine.
# RUF001-003: Hindi/Devanagari text in strings, comments and docstrings is intentional.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
